server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the SPA can call it same-origin (/api/...) — no
    # baked IP, no cross-origin/CORS. The backend service is reachable as
    # `backend:3000` on the compose network. Using Docker's embedded DNS resolver
    # (127.0.0.11) + a variable defers resolution to request time, so this starts
    # even if the backend isn't up yet and survives backend container restarts.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_backend backend;
        proxy_pass http://$api_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset files are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path resolves to index.html so client-side
    # routing works on refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening headers (the app talks to the API cross-origin over http).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
