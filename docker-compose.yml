services:
  # 1. INFRASTRUCTURE: Database & Cache
  postgres:
    image: postgres:15-alpine
    container_name: poth_gulla_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: poth_gulla_cache
    restart: always
    ports:
      - "6379:6379"

  # 2. BACKEND: NestJS API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: poth_gulla_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Injecting the Docker-specific connection strings
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      - postgres
      - redis
    # Mount local files so hot-reloading still works without rebuilding the image
    volumes:
      - ./server:/app
      - /app/node_modules

  # 3. FRONTEND: Vite Admin Dashboard
  admin:
    build:
      context: ./admin-web-client
      dockerfile: Dockerfile
    container_name: poth_gulla_admin_web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./admin-web-client:/app
      - /app/node_modules

volumes:
  pgdata: # Persists your database data even if the container drops
