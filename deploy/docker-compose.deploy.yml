# Deploy stack for the DigitalOcean dev droplet.
# Images are pre-built, signed (cosign) and pushed to GHCR by CI; this file only
# PULLS them - there is no `build:` and no bind-mounted source. The exact,
# digest-pinned image refs and all secrets are provided via the rendered `.env`.
#
#   SERVER_IMAGE / WEB_IMAGE  - ghcr.io/<owner>/<repo>-{server,web}@sha256:<digest>
#
# Plain HTTP, published by IP (no TLS/reverse proxy) - this is a dev box.

services:
  postgres:
    image: postgres:15-alpine
    container_name: poth_gulla_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host - internal network only.

  redis:
    image: redis:7-alpine
    container_name: poth_gulla_cache
    restart: always
    # Internal only.

  backend:
    image: ${SERVER_IMAGE}
    container_name: poth_gulla_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: ${WEB_IMAGE}
    container_name: poth_gulla_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: poth_gulla_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: poth_gulla_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
