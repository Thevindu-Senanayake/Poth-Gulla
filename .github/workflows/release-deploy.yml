# Release & deploy to the DigitalOcean dev droplet.
#
# Flow (triggered by pushing a signed tag `vX.Y.Z`):
#   1. verify-tag — the git tag MUST be SSH-signed by an allowed signer.
#   2. test       — backend unit + e2e tests. FAILS HERE => no build, no deploy.
#   3. changes    — diff vs the previous tag to see which services changed.
#   4. build      — per service: build/sign/attest ONLY if it changed; otherwise
#                   carry forward the previous release's signed digest (Approach B).
#   5. deploy     — SSH to the droplet, cosign-VERIFY both digests (fail closed),
#                   then pull + up the full stack.
#
# Security notes:
#   - Least-privilege GITHUB_TOKEN; OIDC (id-token) only where signing happens.
#   - Images are deployed by immutable digest (never a mutable tag).
#   - HARDENING TODO: pin every `uses:` to a full commit SHA before production.
name: release-deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Require an SSH-signed git tag ───────────────────────────────────────
  verify-tag:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the tag is SSH-signed by an allowed signer
        env:
          SIGNER_IDENTITY: ${{ vars.TAG_SIGNER_IDENTITY }}
          SIGNER_PUBKEY: ${{ secrets.TAG_SIGNING_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNER_IDENTITY}" ] || [ -z "${SIGNER_PUBKEY}" ]; then
            echo "::error::TAG_SIGNER_IDENTITY (var) and TAG_SIGNING_SSH_PUBLIC_KEY (secret) must be set."
            exit 1
          fi
          mkdir -p ~/.ssh
          # allowed_signers: "<principal> <key-type> <key>"
          echo "${SIGNER_IDENTITY} ${SIGNER_PUBKEY}" > ~/.ssh/allowed_signers
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile ~/.ssh/allowed_signers
          # actions/checkout can leave a LIGHTWEIGHT tag pointing at the commit, so
          # `git verify-tag` errors with "cannot verify a non-tag object". Re-fetch
          # the annotated (signed) tag object from origin before verifying.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          echo "Verifying tag ${GITHUB_REF_NAME}…"
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag — sign it with 'git tag -s'."
            exit 1
          fi
          git verify-tag "${GITHUB_REF_NAME}"
          echo "✓ Tag signature is valid."

  # ── 2. Tests gate the whole release ────────────────────────────────────────
  test:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install workspace deps
        run: yarn install --frozen-lockfile || yarn install
      - name: Generate Prisma client
        working-directory: server
        run: yarn prisma generate
      - name: Backend unit tests
        working-directory: server
        run: yarn test
      - name: Backend e2e smoke tests
        working-directory: server
        run: yarn test:e2e

  # ── 3. Which services changed since the previous tag? ──────────────────────
  changes:
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      web: ${{ steps.detect.outputs.web }}
      prev_tag: ${{ steps.detect.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null 2>&1 || true
          CURRENT="${GITHUB_REF_NAME}"
          PREV=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${CURRENT}$" | head -n1 || true)
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"
          if [ -z "${PREV}" ]; then
            echo "No previous tag — building all services."
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Diffing ${PREV}..${CURRENT}"
          CHANGED=$(git diff --name-only "${PREV}" "${CURRENT}")
          echo "$CHANGED"
          server=false; web=false
          echo "$CHANGED" | grep -qE '^server/'      && server=true || true
          echo "$CHANGED" | grep -qE '^web-client/'  && web=true    || true
          # If only shared/infra files changed, redeploy both to be safe.
          if [ "$server" = false ] && [ "$web" = false ]; then server=true; web=true; fi
          echo "server=${server}" >> "$GITHUB_OUTPUT"
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "=> server=${server} web=${web} (prev=${PREV})"

  # ── 4. Build/sign changed services; carry forward unchanged digests ────────
  build:
    needs: [test, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless + attestations (OIDC)
      attestations: write # SLSA provenance / SBOM attestations
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: server
            context: ./server
            dockerfile: ./server/Dockerfile.prod
          - component: web
            context: ./web-client
            dockerfile: ./web-client/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${REPO_LC}-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide build vs carry-forward
        env:
          PREV_TAG: ${{ needs.changes.outputs.prev_tag }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.component }}" = "server" ]; then
            C="${{ needs.changes.outputs.server }}"
          else
            C="${{ needs.changes.outputs.web }}"
          fi
          # Can only carry forward if the previous tag's image actually exists.
          if [ "$C" != "true" ] && [ -n "${PREV_TAG}" ]; then
            if ! docker buildx imagetools inspect "${IMAGE}:${PREV_TAG#v}" >/dev/null 2>&1; then
              echo "Previous image ${IMAGE}:${PREV_TAG#v} not found — building."
              C=true
            fi
          fi
          echo "CHANGED=${C}" >> "$GITHUB_ENV"
          echo "=> ${{ matrix.component }} CHANGED=${C}"

      # ---- changed: build, sign, attest ----
      - name: Image metadata (tags + labels)
        if: env.CHANGED == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push (linux/amd64)
        if: env.CHANGED == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # provenance attested natively below (cleaner cosign subject)
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            ${{ matrix.component == 'web' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}

      - name: Install cosign
        if: env.CHANGED == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        if: env.CHANGED == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance attestation
        if: env.CHANGED == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX)
        if: env.CHANGED == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: env.CHANGED == 'true'
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # ---- unchanged: reuse the previous release's signed digest ----
      - name: Resolve previous digest (carry-forward)
        if: env.CHANGED != 'true'
        id: prev
        env:
          PREV_TAG: ${{ needs.changes.outputs.prev_tag }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${PREV_TAG#v}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Carrying forward ${IMAGE}@${DIGEST} (from ${PREV_TAG})"

      # ---- record the digest-pinned ref either way ----
      - name: Record digest-pinned image ref
        run: |
          DIGEST="${{ steps.build.outputs.digest || steps.prev.outputs.digest }}"
          echo "${IMAGE}@${DIGEST}" > image-ref.txt
          cat image-ref.txt

      - uses: actions/upload-artifact@v4
        with:
          name: imageref-${{ matrix.component }}
          path: image-ref.txt
          retention-days: 7

  # ── 5. Deploy to the droplet (verify signatures, then pull + up) ───────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Collect image refs
        uses: actions/download-artifact@v4
        with:
          pattern: imageref-*
          path: refs

      - name: Resolve image refs
        run: |
          echo "SERVER_IMAGE=$(cat refs/imageref-server/image-ref.txt)" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$(cat refs/imageref-web/image-ref.txt)" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render .env (from secrets)
        run: |
          umask 077
          cat > deploy.env <<EOF
          SERVER_IMAGE=${SERVER_IMAGE}
          WEB_IMAGE=${WEB_IMAGE}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DOCKER_DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}?schema=public
          DOCKER_REDIS_URL=redis://redis:6379
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          EOF

      - name: Copy stack files to droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes ${USER}@${HOST}"
          SCP="scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          $SSH 'mkdir -p ~/poth-gulla/grafana'
          $SCP deploy.env "${USER}@${HOST}:~/poth-gulla/.env"
          $SCP deploy/docker-compose.deploy.yml "${USER}@${HOST}:~/poth-gulla/docker-compose.yml"
          $SCP deploy/prometheus.yml "${USER}@${HOST}:~/poth-gulla/prometheus.yml"
          $SCP -r infra/grafana/provisioning "${USER}@${HOST}:~/poth-gulla/grafana/provisioning"

      - name: Verify signatures & deploy on droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${USER}@${HOST}" \
            SERVER_IMAGE="${SERVER_IMAGE}" WEB_IMAGE="${WEB_IMAGE}" \
            GHCR_USER="${GHCR_USER}" GHCR_TOKEN="${GHCR_TOKEN}" REPO="${REPO}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/poth-gulla
          echo "==> Logging in to GHCR"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

          IDENTITY_RE="^https://github.com/${REPO}/.github/workflows/release-deploy.yml@refs/tags/"
          ISSUER="https://token.actions.githubusercontent.com"
          for IMG in "${SERVER_IMAGE}" "${WEB_IMAGE}"; do
            echo "==> cosign verify ${IMG}"
            cosign verify \
              --certificate-identity-regexp "${IDENTITY_RE}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${IMG}" > /dev/null
          done
          echo "✓ Both images verified."

          echo "==> Pulling & starting the stack"
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io
          REMOTE

      - name: Health check
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          echo "Waiting for the API to report healthy…"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://${HOST}:3000/api" || true)
            if [ "$code" = "200" ]; then echo "✓ API healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::API did not become healthy in time."
          exit 1
